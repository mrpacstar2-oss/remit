[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remit"
version = "0.1.0"
description = "Remit: a small checked plan language for model-written programs"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
remit = "remit.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0", "uvicorn>=0.30", "starlette>=0.37"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remit = ["data/*.md", "data/examples/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
