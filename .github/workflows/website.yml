# Publishes site/ to GitHub Pages. Manual only (Actions tab > Website > Run workflow), because the main
# website is served from the VPS. Before the first run: repository Settings > Pages > Source: "GitHub Actions".
# To publish on every push instead, add "push: branches: [main]" under "on:".
# Optional: Settings > Secrets and variables > Actions > Variables: MCP_URL = https://<your-vps-address>/mcp
name: Website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build AI-facing files
        run: python site/build.py
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SITE_NAME: Remit
          MCP_URL: ${{ vars.MCP_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
